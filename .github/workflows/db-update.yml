name: DB Update Schedule

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL_2: ${{ secrets.SUPABASE_URL_2 }}
      SUPABASE_KEY_2: ${{ secrets.SUPABASE_KEY_2 }}
      POKEMON_API_KEY: ${{ secrets.POKEMON_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt --verbose; fi

      - name: Show installed packages (debug)
        run: |
          echo "--- pip version ---"
          pip --version
          echo "--- pip list ---"
          pip list
      - name: Run DB updater
        run: python pokemon-db-updater.py
