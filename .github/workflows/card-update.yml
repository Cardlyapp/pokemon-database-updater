name: Card Price Update

on:
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_2: ${{ secrets.DATABASE_URL_2 }}
      DATABASE_URLS: ${{ secrets.DATABASE_URLS }}
      CARD_CATALOG_URL: ${{ vars.CARD_CATALOG_URL || 'https://cardlyapp.github.io/cards-database' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --verbose

      - name: Update prices from the published catalog
        run: >-
          python pokemon-db-updater.py
          --catalog-url "$CARD_CATALOG_URL"
          --prices-only
          --db-target both
          --version both
          --batch-size 100
